[package]
name = "danmubox-bili"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "B 站适配器：实现 danmubox-core 的端口（协议、WS、鉴权、WBI、扫码、表情、举报、关注）"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
brotli = "9.0.0"
danmubox-core.workspace = true
flate2 = "1.1.10"
futures-util = "0.3.34"
md5 = "0.8.1"
prost = "0.14.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
