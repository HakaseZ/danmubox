# danmubox · GitHub Actions CI
#
# 刻意只做三件事（不做矩阵、不做发布流程）：
#
#   check             仓库既有的检查：Rust 的 fmt / clippy / test + 前端的 oxlint + tsc -b + vite build。
#                     触发：push 到 main、任何 pull_request、手动 workflow_dispatch。
#   artifacts         出 macOS .dmg 与**已签名的** Android release APK 两个产物并上传。
#                     触发：仅 workflow_dispatch 与 v* tag —— 每次 push 都出包太贵。
#   artifacts-windows 出 Windows 产物：NSIS 安装器 + MSI + 免安装 .exe。
#                     触发：与 artifacts 相同（workflow_dispatch 与 v* tag）。
#
# check 与 artifacts 都跑在 macos-14（Apple Silicon）：
#   * 与开发机同平台 —— check 不必在 Linux 上补 WebKitGTK 那一套系统依赖，
#     命令与 AGENT.md §3 / docs/operations.md §5 里本机验证过的完全一致；
#   * artifacts 产出的因此天然是 arm64 产物，与 §5.5 的 macOS 口径一致。
#
# 命令与版本的事实源：AGENT.md §3（构建 / 测试 / lint）、docs/operations.md §5（三端出包与签名）、
# scripts/android-env.sh（Android 工具链的版本与包名）。这里的每条命令都以上面三处为准，不照抄网上教程。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一个 ref 上的新一轮推送取消上一轮未完成的运行（省 runner 时间）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 检查（fmt / clippy / test / 前端 lint + 构建）
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # macOS runner 自带 rustup + stable；rust-toolchain.toml 声明 channel = "stable" 与
      # components = ["rustfmt", "clippy"]，这里补装两枚组件（幂等）。
      - name: Rust 组件（rustfmt / clippy）
        run: rustup component add rustfmt clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: 缓存 cargo（registry + target）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: 前端依赖
        working-directory: apps/desktop/ui
        run: npm ci

      # 与 `cargo clippy -- -D warnings` 同口径：`npm run lint` = `oxlint --deny-warnings`，
      # **告警即失败**（2026-09-17 起）。规则集与逐条放行理由都在 `apps/desktop/ui/.oxlintrc.json`，
      # 命令口径见 `AGENT.md` §3 与 `README.md` §8。放在构建之前：lint 秒级，先炸最便宜的。
      - name: 前端 lint（oxlint --deny-warnings）
        working-directory: apps/desktop/ui
        run: npm run lint

      - name: 前端类型检查 + 构建（npm run build = tsc -b && vite build）
        working-directory: apps/desktop/ui
        run: npm run build

      # **提交门**：全仓 `cargo fmt --all` 已一次性落地（2026-09-17 实测：修前 `--check` 退出码 1、
      # 127 处 / 18 文件差异；修后两套 rustfmt 都零差异），因此这里**不再有 continue-on-error** ——
      # 与 clippy 同口径，红了就是有文件没格式化，先跑 `cargo fmt --all` 再提交。
      # 工具链口径：宿主 stable（rustfmt 1.8.0）与仓库内 `.android-env/` 那套（rustfmt 1.9.0）
      # 实测结果一致（见 `AGENT.md` §3）。
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  artifacts:
    name: 产物（macOS dmg + Android APK）
    # 只在手动触发或 v* tag 上跑：出包很贵，不该每次 push 都跑。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
      # 显式钉住产物目录，下面的产物路径（target/release/bundle/dmg/）以此为准
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - name: Rust 组件与 Android target
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          # 四个 ABI，与 scripts/android-env.sh 的 DANMUBOX_RUST_TARGETS 一致
          # （通用 APK 含 arm64-v8a / armeabi-v7a / x86 / x86_64，四个 target 缺一不可）
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: 缓存 cargo（registry）
        # 不缓存 target：这里要出 release + 四个 ABI 的安卓产物，体积远超缓存收益；
        # 也不缓存 Gradle（近 GB 级，恢复比重新下载慢）。本 job 只在手动 / 打 tag 时跑。
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-artifacts-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-artifacts-

      # JDK 17：与本机 scripts/android-env.sh 的默认口径一致（它默认把 JAVA_HOME 指到 .android-env/jdk17）
      - name: JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ⚠️ **不要用 `android-actions/setup-android@v3`**：它会去装上游早已下架的 `tools` 包，
      # 在 macos-14 上直接失败（2026-09-21 首次真跑实测：`Warning: Failed to find package 'tools'`
      # → `The process '…/sdkmanager' failed with exit code …` → 整个 job 失败）。
      # 改成与 `scripts/android-env.sh` **同款口径**：自取同一版本的 cmdline-tools（同 mac_arm64 包、
      # 同 URL），解压成 `cmdline-tools/latest`（zip 内层就是 `cmdline-tools/`，不落成 `latest` 的话
      # sdkmanager 找不到自己的根），再用它装我们真正需要的四个组件。
      - name: Android cmdline-tools（自取，不经 setup-android）
        run: |
          set -euo pipefail
          tools_zip="$RUNNER_TEMP/commandlinetools.zip"
          curl -fL --retry 3 -o "$tools_zip" \
            "https://dl.google.com/android/repository/commandlinetools-mac_arm64-16111833_latest.zip"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/cmdline-tools-unzip"
          mkdir -p "$RUNNER_TEMP/cmdline-tools-unzip" "$ANDROID_HOME/cmdline-tools"
          unzip -q "$tools_zip" -d "$RUNNER_TEMP/cmdline-tools-unzip"
          mv "$RUNNER_TEMP/cmdline-tools-unzip/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # PATH 的改动对「后续步骤」生效，所以这一步里用绝对路径自检一次。
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 装 Android SDK 组件
        run: |
          set -euo pipefail
          # 清单与 `scripts/android-env.sh` 一致（版本取本机实测）：compileSdk 36 → `platforms/android-36`；
          # AGP 8.11 用 `build-tools/35.0.0`；NDK 与本机同版本。不需要 emulator / system-image（CI 不跑模拟器）。
          # cmdline-tools 版本已被上一步固定，因此包名只写新 CLI 的 "/" 形式（不再需要 ";" 兜底）。
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "platforms/android-36" "build-tools/35.0.0" "ndk/27.0.12077973"
          # 自检：这三样缺一样，后面的 tauri android build 必然在 Gradle 配置阶段失败。
          ls -d "$ANDROID_HOME/platforms/android-36" \
                "$ANDROID_HOME/build-tools/35.0.0" \
                "$ANDROID_HOME/ndk/27.0.12077973"

      - name: 导出 Android 环境变量 + NDK 链接器配置
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/27.0.12077973"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          ndk_bin="$ndk/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          cfg="${CARGO_HOME:-$HOME/.cargo}/config.toml"
          mkdir -p "$(dirname "$cfg")"
          # 与 scripts/android-env.sh 的 _dmb_write_cargo_config 同口径：四个 target 的 linker/ar/ranlib
          # 指向 NDK 的 clang 包装器（API 级别 24 = Tauri 默认 minSdk）。
          # 注意 ranlib 必须是 { path = "..." } 表，写成裸字符串 cargo 直接报错。
          # armv7 的坑：Rust triple 是 armv7-linux-androideabi，NDK 的 clang 名字却是 armv7a-linux-androideabi。
          cat >> "$cfg" <<EOF
          # 由 .github/workflows/ci.yml 写入（对应本机 scripts/android-env.sh 生成的同款配置）
          [target.aarch64-linux-android]
          linker = "$ndk_bin/aarch64-linux-android24-clang"
          ar = "$ndk_bin/llvm-ar"
          ranlib = { path = "$ndk_bin/llvm-ranlib" }

          [target.armv7-linux-androideabi]
          linker = "$ndk_bin/armv7a-linux-androideabi24-clang"
          ar = "$ndk_bin/llvm-ar"
          ranlib = { path = "$ndk_bin/llvm-ranlib" }

          [target.i686-linux-android]
          linker = "$ndk_bin/i686-linux-android24-clang"
          ar = "$ndk_bin/llvm-ar"
          ranlib = { path = "$ndk_bin/llvm-ranlib" }

          [target.x86_64-linux-android]
          linker = "$ndk_bin/x86_64-linux-android24-clang"
          ar = "$ndk_bin/llvm-ar"
          ranlib = { path = "$ndk_bin/llvm-ranlib" }
          EOF

      - name: 前端依赖
        working-directory: apps/desktop/ui
        run: npm ci

      - name: 出 macOS .dmg
        # bundle.active=false，靠 --bundles 覆盖；没有应用图标也能出（产物见 target/release/bundle/dmg/）
        run: cd apps/desktop && ./ui/node_modules/.bin/tauri build --bundles dmg

      - name: 上传 macOS .dmg
        uses: actions/upload-artifact@v4
        with:
          name: danmubox-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 生成一次性 release 签名材料
        # 本机的 apps/desktop/src-tauri/gen/android/{keystore.jks,keystore.properties} 是自用私钥，
        # 已被 gen/android/.gitignore 忽略 —— 绝不入库、绝不进 CI（见 docs/operations.md §5.7）。
        # CI 里改为一次性生成：口令由 run_id / run_attempt 派生，只活在本次运行里，run 结束即消失，
        # 因此**CI 产物与本地产物签名不同**（装过本地包的设备要先卸载，§5.7、§4.3）。
        run: |
          set -euo pipefail
          cd apps/desktop/src-tauri/gen/android
          ks_pass="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          keytool -genkeypair \
            -keystore ci-release.jks \
            -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$ks_pass" -keypass "$ks_pass" \
            -dname "CN=danmubox CI, OU=ci, O=ci, L=ci, ST=ci, C=CN"
          # 键名与 app/build.gradle.kts 的 signingConfigs.release 一致（storeFile 相对 gen/android/ 解析）
          printf '%s\n' \
            "storeFile=ci-release.jks" \
            "storePassword=$ks_pass" \
            "keyAlias=ci" \
            "keyPassword=$ks_pass" > keystore.properties

      - name: 出 Android release APK
        # 与 docs/operations.md §5.3 的本机命令逐字相同（CI=true 由 Actions 自带，--ci 走非交互路径）。
        # 干净克隆必须先能构建：TauriActivity.kt 与 proguard-tauri.pro 已入库（见 §5.3 与
        # gen/android/app/.gitignore 的例外规则），否则 Gradle 会以 Unresolved reference 失败。
        run: cd apps/desktop && ./ui/node_modules/.bin/tauri android build --apk --ci

      - name: 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: danmubox-android-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

  # Windows 产物：与 `artifacts` 同样的触发口径（只在手动 / v* tag 上跑，出包贵）。
  # 这条 job 是**唯一**的 Windows 出包路径：开发机是 macOS，出不了 Windows 包
  # （`x86_64-pc-windows-msvc` 要 Windows 上的 MSVC 工具链；交叉到 `-gnu` 是另一条路，本仓库不采用）。
  # 产物口径见 docs/operations.md §5.3 的 Windows 段：自用保留 NSIS 安装器 + 免安装 exe，MSI 作备用安装路径。
  artifacts-windows:
    name: 产物（Windows exe + NSIS 安装器 + MSI）
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      # 与 macOS 那边同样显式钉住产物目录，下面三条产物路径以此为准
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: 缓存 cargo（registry）
        # 与 macOS 的 artifacts 同口径：不缓存 target（release 产物体积远超缓存收益）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-artifacts-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-artifacts-

      - name: 前端依赖
        working-directory: apps/desktop/ui
        run: npm ci

      - name: 出 Windows 产物（NSIS 安装器 + MSI）
        # shell 显式取 bash（runner 默认是 pwsh）：这条命令因此与 docs/operations.md §5.3 里
        # macOS / Android 的写法是同一种形态（`./ui/node_modules/.bin/tauri …`）。
        # `bundle.active=false` 由 `--bundles` 覆盖（与 macOS 那边同理）。
        #
        # `--config` **只**覆盖 Windows 这一侧的 `bundle.icon`，不动共享的 `tauri.conf.json`：
        # `bundle.icon = []` 在 macOS 上能出 dmg，在 Windows 上过不去 —— 两处都硬要一枚 `.ico`：
        #   ① 编译期 `tauri-build` 的 Windows 资源（winres）步骤：`bundle.icon` 里没有 `.ico`
        #      就回落到 `icons/icon.ico`，该文件不存在则直接报错中断编译
        #      （首次真跑 run 35211873761 撞到的就是这一条）；
        #   ② 打包期 MSI（WiX）那条路径要求 `bundle.icon` 里能找到 `.ico` —— tauri-cli 把
        #      bundler 的 `windows.iconPath` 显式置成空 PathBuf（`interface/rust.rs`），
        #      于是只能回落到 `bundle.icon` 列表，列表为空就报 `Couldn't find a .ico icon`
        #      （这一条按上游源码核对，没真的撞上过 —— 上面那枚 .ico 同时修掉了 ①，也就轮不到 ②）。
        # 相应地 `icons/icon.ico` 也入库（`tauri icon` 从 `icons/icon.png` 生成，6 个尺寸：
        # 16/24/32/48/64/256）。NSIS 那条路径不读 `bundle.icon`：它只看可选的 `nsis.installerIcon`
        # （本仓库没设 ⇒ 用 NSIS 自己的默认图标；据上游 nsis 模板核对，未真机看过）。
        #
        # 图标口径为什么这样定、三端各读到什么、实测记录：docs/operations.md §5.3
        # 「图标与 `bundle.icon` 的口径」。要把它合并进共享配置，先想清楚 macOS / Android
        # 那两端的打包输入也跟着变，而且**改完必须手动跑一次本 job 才算验过**。
        shell: bash
        run: cd apps/desktop && ./ui/node_modules/.bin/tauri build --bundles nsis,msi --config '{"bundle":{"icon":["icons/icon.ico"]}}'

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: danmubox-windows
          path: |
            target/release/danmubox-desktop.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
