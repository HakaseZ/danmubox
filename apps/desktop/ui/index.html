<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!--
      `viewport-fit=cover`：移动端的 `env(safe-area-inset-*)` 只有在 cover 下才给真值，
      而界面的 `--safe-top` / `--safe-bottom`（app.module.css 的令牌段）默认值正是它。
      桌面窗口没有系统 inset，这一档永远是 0，加不加都一样（Chromium 桌面本来也不按
      meta viewport 排版）；加了它，iOS 外壳与「原生 inset 没送到」的兜底路径才有值。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      上游的图片 CDN 有防盗链：来源不是 ac站就返回 403，而不带 Referer 才放行。
      界面跑在 localhost / tauri.localhost 上，默认会带上这个来源，于是所有表情图
      被 CDN 拒绝；浏览器再以 ORB（Opaque Response Blocking）拦掉，最终显示成一个问号，
      而且**不留任何控制台线索**。这里统一不发 Referer（实测放行）。
    -->
    <meta name="referrer" content="no-referrer" />
    <title>弹幕框</title>
    <!--
      首帧之前的主题默认值：真正的主题偏好要等 IPC（bootstrap）回来才知道，
      而 :root 的基座是深色 —— 浅色系统上会先画一帧深色再翻白。这里用系统外观给一个
      同口径的默认值（system 那一档的解析规则与 App.tsx 的主题 effect 逐字相同），
      App 挂载后立刻用真实 prefs 覆盖它。
      必须早于下面的 module bundle：module 是 defer 的，等它执行就已经画过一帧了。
    -->
    <script>
      document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)")
        .matches
        ? "light"
        : "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
